name: Bug report
description: Something in aswap isn't working right
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you see, and what did you expect instead?
      placeholder: Ran `aswap switch 2`, got ... — expected ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aswap version and install method
      description: Output of `aswap --version`, and whether you installed with uv, pipx, or from source.
      placeholder: agent-swap 1.0.0, installed with uv
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Credentials are stored differently per platform, so this matters a lot.
      options:
        - macOS
        - Linux
        - Windows
        - WSL
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: Which part is affected?
      multiple: true
      options:
        - Claude accounts (switch, list, add, auto-switch)
        - Codex accounts (aswap codex)
        - Web control panel (aswap gui)
        - Terminal dashboard (aswap / aswap watch)
        - Menu bar (macOS)
        - Install or upgrade
  - type: dropdown
    id: claude-code
    attributes:
      label: How do you run Claude Code?
      multiple: true
      options:
        - CLI (terminal)
        - VS Code extension
        - Desktop app
  - type: textarea
    id: logs
    attributes:
      label: Command output or logs
      description: Paste the failing command's output — `aswap list` for Claude account state, `aswap codex list` for Codex, `aswap auto` log lines for auto-switch issues. Formatted automatically, no backticks needed. Please redact emails and account identifiers, and never paste access or refresh tokens, API keys, setup tokens, or credential-file or Keychain contents.
      render: shell
