<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-swap</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <span class="muted">watching all accounts</span>
  <span id="mode" class="muted"></span>
  <span id="updated" class="muted"></span>
</header>
<p id="conn" class="warn" role="alert"></p>
<p id="notice" class="muted" role="status"></p>
<p id="job" class="on" role="status"></p>

<section>
  <div class="section-head"><span class="muted">claude</span></div>
  <div id="claude-tools" class="tools" hidden></div>
  <main id="accounts" aria-live="polite"></main>
</section>

<section id="auto-panel" hidden>
  <div class="section-head"><span class="muted">auto-switch</span><span id="auto-state"></span></div>
  <div id="auto-tools" class="tools"></div>
  <div id="auto-summary" class="note muted"></div>
  <div id="auto-log" class="log"></div>
  <p class="note muted">It runs only while this page's server (<code>aswap gui</code>) is running. Run it in one place: not here and also <code>cswap auto</code> or the menu bar.</p>
</section>

<section id="codex" hidden>
  <div class="section-head"><span class="muted">codex</span></div>
  <div id="codex-tools" class="tools" hidden></div>
  <p id="codex-note" class="muted"></p>
  <main id="codex-accounts" aria-live="polite"></main>
</section>

<dialog id="dlg" aria-labelledby="dlg-title">
  <h2 id="dlg-title"></h2>
  <p id="dlg-text" class="muted"></p>
  <div id="dlg-fields"></div>
  <div class="dlg-actions">
    <button id="dlg-cancel" type="button" class="btn">cancel</button>
    <button id="dlg-ok" type="button" class="btn primary">ok</button>
  </div>
</dialog>
<script src="/app.js"></script>
</body>
</html>
