<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-swap</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <span class="brand">agent-swap</span>
  <span id="mode" class="muted"></span>
  <span id="updated" class="muted"></span>
</header>
<p id="conn" class="warn" role="alert"></p>
<p id="notice" class="muted" role="status"></p>

<div id="panels" class="panels"></div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <h2 id="dlg-title"></h2>
  <p id="dlg-text" class="muted"></p>
  <div id="dlg-fields"></div>
  <div class="dlg-actions">
    <button id="dlg-cancel" type="button" class="btn">cancel</button>
    <button id="dlg-ok" type="button" class="btn primary">ok</button>
  </div>
</dialog>
<script src="/app.js"></script>
</body>
</html>
