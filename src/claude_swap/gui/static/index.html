<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-swap</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <span class="brand">agent-swap</span>
  <span id="mode" class="muted"></span>
  <span id="updated" class="muted"></span>
  <span id="working" class="on" role="status"></span>
  <button id="refresh" type="button" class="link primary" title="check every account now  (f)" hidden>refresh</button>
</header>
<p id="conn" class="warn" role="alert"></p>

<div id="panels" class="panels"></div>

<section id="activity" aria-label="activity">
  <div class="sub">activity</div>
  <div id="log" role="log" aria-live="polite"></div>
</section>

<footer id="keys" class="keys"></footer>

<dialog id="dlg" aria-labelledby="dlg-title">
  <h2 id="dlg-title"></h2>
  <p id="dlg-text" class="muted"></p>
  <div id="dlg-fields"></div>
  <div class="dlg-actions">
    <button id="dlg-cancel" type="button" class="btn">cancel</button>
    <button id="dlg-ok" type="button" class="btn primary">ok</button>
  </div>
</dialog>
<script src="/app.js"></script>
</body>
</html>
